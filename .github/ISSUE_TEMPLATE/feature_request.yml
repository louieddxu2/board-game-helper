name: Feature request
description: 提議改善目前桌遊應用的功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        本專案以桌遊產品為中心。請說明這項提議如何改善現有用途；「其他領域也可能用得到」本身不足以要求通用化。
  - type: textarea
    id: problem
    attributes:
      label: 要解決的問題
      description: 誰遇到什麼問題？目前如何處理？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 請描述你希望的行為，不必先指定實作方式。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 資料與相容性影響
      description: 是否涉及 D1、migration、API、登入、備份或既有資料？
