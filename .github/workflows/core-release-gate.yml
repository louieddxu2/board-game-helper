name: Core release gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  TZ: Asia/Taipei

concurrency:
  group: core-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Verify release invariants
        run: npm run test:release
